[workspace]
resolver = "3"
members = [
    "crates/birch-core",
    "crates/birch-tui",
    "crates/birch",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/slukyano/birch"
homepage = "https://github.com/slukyano/birch"
keywords = ["tui", "terminal", "file-manager", "tree", "ratatui"]
categories = ["command-line-utilities"]

[workspace.dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
shell-words = "1.1"
ignore = "0.4"
globset = "0.4"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
signal-hook = "0.3"
unicode-segmentation = "1"
# Delete goes to the platform trash (ADR 0031): the XDG spec wants .trashinfo
# records and a per-mount trash directory, which a rename into a folder does
# not reproduce. On macOS birch selects `DeleteMethod::NsFileManager` over the
# crate's Finder default — see `ops::trash_context`.
trash = { version = "5", default-features = false }
# Restoring from the trash (ADR 0033). `trash` calls `-[NSFileManager
# trashItemAtURL:resultingItemURL:error:]` with a null out-parameter, discarding
# the one thing an undo needs: where the item landed. birch makes the same call
# and keeps the answer. Same versions and features `trash` already pulls in, so
# this costs no extra compilation.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
